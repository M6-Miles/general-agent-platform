[project]
name = "auditable-agent-runtime"
version = "0.1.0"
description = "Multi-tenant, auditable Agent Runtime MVP"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "sqlalchemy>=2.0,<3",
  "alembic>=1.14,<2",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.6,<3",
  "PyJWT>=2.9,<3",
  "pwdlib[argon2]>=0.2,<1",
  "email-validator>=2.2,<3",
  "jsonschema>=4.23,<5",
  "redis>=5.2,<6",
  "python-multipart>=0.0.9,<1",
  "PyYAML>=6.0,<7",
  "pypdf>=5.0,<6",
  "python-docx>=1.1,<2",
  "openpyxl>=3.1,<4",
  "numpy==1.26.4",
  "scipy==1.11.4",
  "scikit-learn==1.4.2",
  "torch==2.6.0",
  "transformers==4.46.3",
  "sentence-transformers==3.3.1",
  "rank-bm25>=0.2.2,<1",
  "jieba>=0.42.1,<1",
]

[project.optional-dependencies]
test = ["pytest>=8.3,<9", "httpx>=0.27,<1"]
lint = ["ruff>=0.8,<1"]
secrets = ["boto3>=1.35,<2", "hvac>=2.3,<3"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
lint.ignore = ["B008"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
